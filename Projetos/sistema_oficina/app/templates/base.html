<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Sistema da Oficina
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">

            <div class="sidebar-header">
                <h1 class="sidebar-title">
                    Sistema da Oficina
                </h1>

                <p class="sidebar-subtitle">
                    Gestão de serviços e clientes
                </p>
            </div>

            <nav class="sidebar-menu">

                <a
                    href="{{ url_for('dashboard_web.index') }}"
                    class="sidebar-link"
                >
                    Dashboard
                </a>

                <a
                    href="{{ url_for('cliente_web.listar') }}"
                    class="sidebar-link"
                >
                    Clientes
                </a>

                <a
                    href="{{ url_for('ordem_servico_web.listar') }}"
                    class="sidebar-link"
                >
                    Ordens de Serviço
                </a>

                <a
                    href="{{ url_for('notificacao_web.listar') }}"
                    class="sidebar-link"
                >
                    Notificações
                </a>

            </nav>

        </aside>

        <div class="main-area">

            <header class="topbar">

                <div>
                    <h2 class="topbar-title">
                        {% block page_title %}
                            Sistema da Oficina
                        {% endblock %}
                    </h2>

                    <p class="topbar-subtitle">
                        Controle de atendimentos e manutenções
                    </p>
                </div>

            </header>

            <main class="content-area">
                {% block content %}
                {% endblock %}
            </main>

        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    {% block scripts %}
    {% endblock %}

</body>

</html>
